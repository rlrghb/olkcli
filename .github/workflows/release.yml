name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pre-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build linux and windows archives
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --config .goreleaser-prebuild.yaml --clean --timeout 30m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 1

  release:
    runs-on: macos-latest
    needs: pre-build
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Download prebuilt archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prebuilt-archives
          path: prebuilt-archives/

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  # Publish the `olk` CLI to npm (esbuild-style binary wrapper) so it is
  # installable via npx/npm and listable on the MCP Registry. Publishes via
  # npm Trusted Publishing (OIDC) — no stored token: each package
  # (olkcli + the six olk-<platform> packages) has a trusted publisher
  # configured for this repo + workflow, and npm mints a short-lived
  # credential per run from the GitHub OIDC identity. Gated on the
  # PUBLISH_NPM repo variable.
  npm-publish:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing
      contents: read # checkout + gh release download
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (Trusted Publishing/OIDC requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Extract release binaries into per-platform packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p rel tmpx
          gh release download "$GITHUB_REF_NAME" -p "olk_${VERSION}_*" -D rel
          extract() { # archive dest exe
            mkdir -p "$(dirname "$2")"
            if [[ "$1" == *.zip ]]; then unzip -o "$1" "$3" -d tmpx; else tar -xzf "$1" -C tmpx "$3"; fi
            mv "tmpx/$3" "$2"
          }
          extract "rel/olk_${VERSION}_darwin_amd64.tar.gz"  npm/olk-darwin-x64/bin/olk      olk
          extract "rel/olk_${VERSION}_darwin_arm64.tar.gz"  npm/olk-darwin-arm64/bin/olk    olk
          extract "rel/olk_${VERSION}_linux_amd64.tar.gz"   npm/olk-linux-x64/bin/olk       olk
          extract "rel/olk_${VERSION}_linux_arm64.tar.gz"   npm/olk-linux-arm64/bin/olk     olk
          extract "rel/olk_${VERSION}_windows_amd64.zip"    npm/olk-win32-x64/bin/olk.exe   olk.exe
          extract "rel/olk_${VERSION}_windows_arm64.zip"    npm/olk-win32-arm64/bin/olk.exe olk.exe
          chmod +x npm/olk-*/bin/olk

      - name: Stamp versions and publish to npm
        run: node scripts/build-npm.mjs "${GITHUB_REF_NAME}" --publish

  # Publish the server.json to the official MCP Registry. Runs after the npm
  # package is live (the registry validates it). Uses GitHub OIDC — no secret.
  registry-publish:
    runs-on: ubuntu-latest
    needs: npm-publish
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Stamp server.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version=$v | .packages[0].version=$v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
